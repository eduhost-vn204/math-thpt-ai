name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/math_thpt_test?schema=public"
      AUTH_SECRET: "ci-test-super-secret-key-32-chars-long-2026"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4o-mini"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run KaTeX math formula test
        run: npm run test:math

      - name: Next.js Build
        run: npm run build
