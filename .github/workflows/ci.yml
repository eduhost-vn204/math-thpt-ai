name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: math_thpt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/math_thpt_test?schema=public"
      AUTH_SECRET: "ci-test-super-secret-key-32-chars-long-2026"
      AI_PROVIDER: "gemini"
      GEMINI_API_KEY: ""
      AI_MODEL: "gemini-2.5-flash"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4o-mini"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run KaTeX math formula test
        run: npm run test:math

      - name: Next.js Build
        run: npm run build
